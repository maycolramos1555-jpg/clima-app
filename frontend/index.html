<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App del Clima</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gradient-to-br from-blue-900 to-blue-600 min-h-screen p-8">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-4xl font-bold text-white text-center mb-8">
        App del Clima
      </h1>

      <div class="bg-white rounded-2xl p-6 shadow-xl mb-6">
        <div class="flex gap-3">
          <input
            id="inputCiudad"
            type="text"
            placeholder="Busca una ciudad..."
            class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
            onkeypress="if (event.key === 'Enter') buscarClima();"
          />
          <button
            id="btnBuscar"
            onclick="buscarClima()"
            class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold transition"
          >
            Buscar
          </button>
        </div>
        <p id="errorMensaje" class="text-red-500 text-sm mt-2 hidden"></p>
      </div>

      <div
        id="resultadoClima"
        class="hidden bg-white rounded-2xl p-6 shadow-xl mb-6"
      >
        <h2
          class="text-2xl font-bold text-gray-800 mb-2"
          id="nombreCiudad"
        ></h2>
        <p class="text-6xl font-bold text-blue-500 mb-2" id="temperatura"></p>
        <p class="text-gray-500 text-lg capitalize" id="descripcion"></p>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-gray-800">
            Historial de búsquedas
          </h2>
          <button
            onclick="limpiarHistorial()"
            class="text-sm text-red-500 hover:text-red-700 font-semibold"
          >
            Limpiar Historial
          </button>
        </div>
        <div id="historial">
          <p class="text-gray-400 text-center py-4">
            El historial de búsquedas aparecerá aquí.
          </p>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:8082/api/clima";

      async function buscarClima() {
        const ciudad = document.getElementById("inputCiudad").value.trim();
        if (!ciudad) return;

        const btn = document.getElementById("btnBuscar");
        const errorMsg = document.getElementById("errorMensaje");
        btn.textContent = "Buscando...";
        btn.disabled = true;
        errorMsg.classList.add("hidden");

        try {
          const res = await fetch(`${API_URL}/buscar-externo/${ciudad}`);

          if (!res.ok) {
            throw new Error("Ciudad no encontrada");
          }

          const data = await res.json();

          document.getElementById("nombreCiudad").textContent =
            `${data.ciudad}, ${data.pais}`;
          document.getElementById("temperatura").textContent =
            `${Math.round(data.temperatura)}°C`;
          document.getElementById("descripcion").textContent = data.descripcion;
          document.getElementById("resultadoClima").classList.remove("hidden");

          cargarHistorial();
        } catch (error) {
          errorMsg.textContent =
            "Ciudad no encontrada. Por favor, intenta con otra.";
          errorMsg.classList.remove("hidden");
          document.getElementById("resultadoClima").classList.add("hidden");
        } finally {
          btn.textContent = "Buscar";
          btn.disabled = false;
          document.getElementById("inputCiudad").value = "";
        }
      }

      async function cargarHistorial() {
        const res = await fetch(`${API_URL}/historial`);
        const data = await res.json();
        const historialDiv = document.getElementById("historial");

        if (data.length === 0) {
          historialDiv.innerHTML =
            '<p class="text-gray-400 text-center py-4">El historial de búsquedas aparecerá aquí.</p>';
          return;
        }

        historialDiv.innerHTML = data
          .reverse()
          .map(
            (b) => `
                <div class="flex justify-between items-center border-b py-3 last:border-b-0">
                    <div>
                        <p class="font-semibold text-gray-800">${b.ciudad}, ${b.pais}</p>
                        <p class="text-gray-500 text-sm capitalize">${b.descripcion}</p>
                    </div>
                    <p class="text-blue-500 font-bold text-xl">${Math.round(b.temperatura)}°C</p>
                </div>
            `,
          )
          .join("");
      }

      async function limpiarHistorial() {
        if (
          !confirm("¿Estás seguro de que quieres borrar todo el historial?")
        ) {
          return;
        }
        await fetch(`${API_URL}/historial`, { method: "DELETE" });
        cargarHistorial();
      }

      // Carga inicial del historial
      cargarHistorial();
    </script>
  </body>
</html>
